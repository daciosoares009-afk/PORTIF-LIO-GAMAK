    <title>GAMAK | Obras, instalações e manutenções</title>
    <script>
      (() => {
        const saved = localStorage.getItem('gamak-theme');
        const theme = saved || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]')?.setAttribute('content', theme === 'dark' ? '#00131F' : '#FFFDF8');
      })();
    </script>
